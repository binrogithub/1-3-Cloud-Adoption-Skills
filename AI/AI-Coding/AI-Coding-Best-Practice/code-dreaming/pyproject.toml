[project]
name = "code-dreaming"
version = "0.1.0"
description = "Memory hygiene and project knowledge engine for AI coding agents — dedup, stale-path validation, conflict detection, code indexing, and team sharing."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "tree-sitter>=0.23",
]

[project.optional-dependencies]
languages = [
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]
sharing = [
    "zstandard>=0.21",
]

[project.scripts]
mce = "mce.cli:main"

[tool.setuptools.packages.find]
include = ["mce*"]
