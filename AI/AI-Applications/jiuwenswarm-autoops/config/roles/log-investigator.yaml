id: log-investigator
display_name: Log Investigator
responsibility: Diagnose a bounded incident window from Loki or local journal evidence and identify read-only next checks.
model:
  provider: huawei-maas-openai-compatible
  base_url_env: API_BASE
  api_key_env: API_KEY
  model_env: MODEL_NAME
tools:
  allow:
    - logs.query
  deny:
    - runbook.execute
    - host.ensure_service
    - ansible.playbook.run
    - kubectl.apply
    - kubectl.delete
execution:
  mode: inspect
  max_model_rounds: 3
  timeout_seconds: 90
  require_structured_result: true
