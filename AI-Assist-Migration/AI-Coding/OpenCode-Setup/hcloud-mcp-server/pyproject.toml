[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcloud-mcp-server"
version = "0.4.0"
description = "MCP server for Huawei Cloud (hcloud) CLI — 150 tools, 34 services, annotations, truncation"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
hcloud-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
