required_mcps:
  - name: dataarts-deploy-agent
    version: "0.2.0"
    path: ../../../../shared/mcps/dataarts-deploy-agent
    runtime: node
    entry_point: src/mcp-server.mjs
    transport: stdio
    tools:
      - name: snowflake_dataarts_demo_plan
        used: true
        access: read_only
        approval_required: false
        description: "Run plan-only (read-only) for migration scope discovery"
      - name: snowflake_dataarts_demo_run
        used: true
        access: write
        approval_required: true
        description: "Run full one-shot demo synchronously (requires confirm=true)"
      - name: snowflake_dataarts_demo_start
        used: true
        access: write
        approval_required: true
        description: "Start one-shot demo asynchronously (requires confirm=true)"
      - name: snowflake_dataarts_demo_status
        used: true
        access: read_only
        approval_required: false
        description: "Read demo run status and progress"
      - name: snowflake_dataarts_demo_last_report
        used: true
        access: read_only
        approval_required: false
        description: "Read demo report markdown"
      - name: snowflake_dataarts_demo_equivalence_summary
        used: true
        access: read_only
        approval_required: false
        description: "Generate equivalence summary (Snowflake vs DataArts)"
    tools_not_used: []
    write_operations:
      - snowflake_dataarts_demo_run
      - snowflake_dataarts_demo_start
    validation_status: VERIFIED_FROM_CODE

optional_mcps:
  - name: huaweicloud-pricing
    version: "0.1.0"
    path: ../../../../shared/mcps/huaweicloud-pricing
    runtime: node
    entry_point: src/server.mjs
    transport: stdio
    tools_used: []
    tools_not_used:
      - QueryCloudServiceTypes
      - QueryResourceTypes
      - QueryServiceResources
      - QueryUsageTypes
      - QueryMeasurementUnits
      - QueryElbFlavors
      - QueryElbAvailabilityZones
      - QueryRdsFlavors
      - QueryRdsStorageTypes
      - QueryEcsFlavors
      - QueryEvsVolumeTypes
      - PricingHealthCheck
      - ListPricingTemplates
      - ExplainRequiredTemplate
      - EstimateArchitectureCostDraft
      - EstimateArchitectureOnDemandPrice
      - EstimateTemplateOnDemandPrice
      - EstimateTemplatePeriodPrice
      - EstimateArchitecturePeriodPrice
      - QueryOnDemandPrice
      - QueryPeriodPrice
      - RenderProductInfosFromTemplate
      - PricingProductInfoGuide
      - EvaluateEcsFlavorAvailability
      - FindEcsFlavorCandidates
    write_operations: []
    validation_status: VERIFIED_FROM_CODE

  - name: huaweicloud-ticket
    version: "0.1.0"
    path: ../../../../shared/mcps/huaweicloud-ticket
    runtime: node
    entry_point: src/server.mjs
    transport: stdio
    tools_used: []
    tools_not_used:
      - init_session
      - list_service_categories
      - list_issue_categories
      - get_ticket_form_schema
      - list_regions
      - list_severities
      - check_create_privilege
      - prepare_ticket
      - create_ticket
      - list_tickets
    write_operations: []
    validation_status: VERIFIED_FROM_CODE

  - name: playwright
    version: latest
    path: ../../../../shared/integrations/playwright
    runtime: npx
    entry_point: "@playwright/mcp@latest"
    transport: stdio
    tools_used: []
    tools_not_used: []
    write_operations: []
    validation_status: VERIFIED_FROM_DOCUMENTATION
