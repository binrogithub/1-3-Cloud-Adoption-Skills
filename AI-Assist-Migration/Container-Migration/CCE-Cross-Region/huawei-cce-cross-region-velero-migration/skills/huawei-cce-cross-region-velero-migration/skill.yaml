name: huawei-cce-cross-region-velero-migration
version: 1.0.0
category: migration
status: EXPERIMENTAL
risk_level: high
requires_explicit_approval: true

scenario:
  source: cce-cluster
  target: cce-cluster
  topology: cross-region
  mechanism: velero-backup-restore

mcps:
  required:
    - huaweicloud-deploy
  optional:
    - huaweicloud-pricing
    - huaweicloud-ticket
    - playwright

capability_gap:
  builder_skill: mcp-capability-builder
  allow_new_mcp_scaffolding: true
  allow_live_activation: false
  require_manual_review: true
  known_gaps:
    - id: GAP-CCE-001
      description: "No MCP tool for CCE cluster discovery"
      phase: discovery
      decision: MANUAL_STEP
    - id: GAP-CCE-002
      description: "No MCP tool for Velero backup/restore operations"
      phase: execution
      decision: MANUAL_STEP
    - id: GAP-CCE-003
      description: "No MCP tool for Kubernetes version validation"
      phase: architecture_validation
      decision: MANUAL_STEP
    - id: GAP-CCE-004
      description: "No MCP tool for StorageClass cross-region mapping"
      phase: execution
      decision: MANUAL_STEP
    - id: GAP-CCE-005
      description: "No MCP tool for DNS record migration"
      phase: cutover
      decision: MANUAL_STEP
    - id: GAP-CCE-006
      description: "No MCP tool for ELB/EIP cross-region migration"
      phase: execution
      decision: MANUAL_STEP
    - id: GAP-CCE-007
      description: "CCE not in huaweicloud-deploy supported services"
      phase: plan_generation
      decision: EXTEND_EXISTING_MCP

phases:
  - name: discovery
    automation: ASSISTED
    mcp_tools_used: []
  - name: architecture_validation
    automation: ASSISTED
    mcp_tools_used:
      - huaweicloud-deploy:RunTerraformPlan
      - huaweicloud-deploy:ExplainTerraformPlan
  - name: readiness
    automation: MANUAL
    mcp_tools_used: []
  - name: plan_generation
    automation: ASSISTED
    mcp_tools_used:
      - huaweicloud-deploy:GenerateTerraformFromArchitecture
      - huaweicloud-deploy:ValidateTerraformConfiguration
  - name: approval
    automation: MANUAL
    mcp_tools_used: []
  - name: execution
    automation: MANUAL
    mcp_tools_used: []
  - name: validation
    automation: MANUAL
    mcp_tools_used: []
  - name: cutover
    automation: MANUAL
    mcp_tools_used: []
  - name: rollback
    automation: MANUAL
    mcp_tools_used: []
  - name: closure
    automation: ASSISTED
    mcp_tools_used: []

outputs:
  - discovery-report
  - architecture-validation-report
  - readiness-report
  - migration-plan
  - terraform-files
  - execution-log
  - validation-report
  - rollback-plan
  - final-report
