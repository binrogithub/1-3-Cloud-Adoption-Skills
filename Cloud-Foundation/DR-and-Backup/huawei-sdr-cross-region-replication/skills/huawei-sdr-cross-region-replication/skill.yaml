name: huawei-sdr-cross-region-replication
version: 1.0.0
category: migration
status: EXPERIMENTAL
risk_level: critical
requires_explicit_approval: true

domain: Cloud-Foundation
family: DR-and-Backup
service: SDRS
canonical_name: Storage Disaster Recovery Service
aliases:
  - SDR
  - SDRS
  - Storage Disaster Recovery Service

scenario:
  source: ecs-evs-production-region
  target: ecs-evs-dr-region
  topology: cross-region-replication
  mechanism: sdrs-protection-group-protected-instance-replication-pair

mcps:
  required: []
  optional:
    - huaweicloud-pricing
    - huaweicloud-ticket
    - huaweicloud-deploy

shared_skills:
  required:
    - mcp-capability-builder

capability_gap:
  builder_skill: mcp-capability-builder
  allow_new_mcp_scaffolding: false
  allow_live_activation: false
  require_manual_review: true
  create_new_mcp_candidate: true
  known_gaps:
    - id: GAP-SDR-001
      description: "No SDRS CLI support in hcloud 6.2.9; all SDRS operations are MANUAL_CONSOLE"
      phase: all
      decision: MANUAL_CONSOLE
    - id: GAP-SDR-002
      description: "No SDRS MCP exists; no automation possible for SDRS operations"
      phase: all
      decision: CREATE_NEW_MCP_CANDIDATE
    - id: GAP-SDR-003
      description: "Failover, reverse reprotection, and failback are critical operations with no automation safeguard"
      phase: execution
      decision: MANUAL_CONSOLE
    - id: GAP-SDR-004
      description: "Replication monitoring requires manual console checks"
      phase: monitoring
      decision: MANUAL_CONSOLE
    - id: GAP-SDR-005
      description: "SDRS not in huaweicloud-deploy supported services"
      phase: plan_generation
      decision: EXTEND_EXISTING_MCP
    - id: GAP-SDR-006
      description: "Region pair support must be verified manually"
      phase: readiness
      decision: REGION_DEPENDENT
    - id: GAP-SDR-007
      description: "DR gateway installation and configuration are manual operations"
      phase: execution
      decision: MANUAL_CONSOLE

phases:
  - name: parse_intent
    automation: AUTOMATED
    mcp_tools_used: []
  - name: validate_service_topology
    automation: ASSISTED
    mcp_tools_used: []
  - name: discover_production
    automation: ASSISTED
    mcp_tools_used: []
  - name: discover_dr_site
    automation: ASSISTED
    mcp_tools_used: []
  - name: dependency_analysis
    automation: AUTOMATED
    mcp_tools_used: []
  - name: rpo_rto_plan
    automation: ASSISTED
    mcp_tools_used: []
  - name: architecture_plan
    automation: AUTOMATED
    mcp_tools_used: []
  - name: readiness_review
    automation: ASSISTED
    mcp_tools_used: []
  - name: prepare_gateway
    automation: MANUAL
    mcp_tools_used: []
  - name: configure_protection
    automation: MANUAL
    mcp_tools_used: []
  - name: monitor_replication
    automation: ASSISTED
    mcp_tools_used: []
  - name: prepare_dr_drill
    automation: MANUAL
    mcp_tools_used: []
  - name: execute_dr_drill
    automation: MANUAL
    mcp_tools_used: []
  - name: plan_failover
    automation: MANUAL
    mcp_tools_used: []
  - name: execute_failover
    automation: MANUAL
    mcp_tools_used: []
  - name: reverse_reprotection
    automation: MANUAL
    mcp_tools_used: []
  - name: failback
    automation: MANUAL
    mcp_tools_used: []
  - name: closure
    automation: AUTOMATED
    mcp_tools_used: []

hcloud:
  service: SDRS
  verified_version: 6.2.9
  newer_version_pending: 7.2.12
  sdrs_cli_support: NOT_AVAILABLE
  sdrs_mcp_support: NOT_AVAILABLE
  operations_verified: []
  related_services_verified:
    - ECS ListServersDetails
    - EVS ListVolumes
    - VPC ListVpcs
    - VPC ListSubnets
    - VPC ListSecurityGroups
    - VPC ListSecurityGroupRules
    - EIP ListPublicIps

execution:
  primary_mechanism: manual_console
  automation_blocker: missing_sdrs_cli_and_mcp
  core_manual_workflow_blocker: false
  automated_workflow_blocker: true

inputs:
  required:
    - scenario
    - production_region
    - dr_region
    - source_ecs_names
    - approval_owner
  optional:
    - production_az
    - dr_az
    - disk_scope
    - application_type
    - stateful_or_stateless
    - target_rpo
    - target_rto
    - replication_mode
    - gateway_topology
    - network_bandwidth
    - target_vpc
    - target_subnet
    - target_security_groups
    - dns_cutover_strategy
    - recovery_order
    - maintenance_window
    - failback_expectation
    - data_retention_requirement
    - dr_drill_requirement

outputs:
  - sdr-intent
  - sdr-capability-assessment
  - sdr-source-inventory
  - sdr-target-inventory
  - sdr-application-dependency-map
  - sdr-rpo-rto-plan
  - sdr-architecture-plan
  - sdr-readiness-report
  - sdr-gateway-result
  - sdr-protection-result
  - sdr-replication-status-report
  - sdr-drill-plan
  - sdr-drill-result
  - sdr-failover-plan
  - sdr-failover-result
  - sdr-reverse-reprotection-plan
  - sdr-failback-plan
  - sdr-final-report

approval_gates:
  - protection_group_creation
  - protected_instance_creation
  - replication_pair_creation
  - enable_protection
  - dr_drill
  - planned_failover
  - unplanned_failover
  - reverse_reprotection
  - failback
  - gateway_installation
  - dns_change

evidence_policy:
  log_all_cli_commands: true
  log_all_manual_actions: true
  record_approvals: true
  record_timestamps: true
  sanitize_ids: true
  no_secrets: true

regional_validation:
  require_region_pair_check: true
  require_sdrs_availability_check: true
  require_quota_check: true
  require_capacity_check: true
