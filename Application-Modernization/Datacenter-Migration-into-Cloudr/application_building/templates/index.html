<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食堂订餐系统</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>食堂订餐系统</h1>
        <p>在线点餐 · 到点取餐</p>
      </div>
      <a class="admin-link" href="/admin/orders" target="_blank" rel="noopener noreferrer">查看订单管理</a>
    </header>

    <main class="layout">
      <section class="panel menu-panel">
        <h2>今日菜单</h2>
        {% for category, items in grouped_menu.items() %}
          <div class="menu-category">
            <h3>{{ category }}</h3>
            <table>
              <thead>
                <tr>
                  <th>菜品</th>
                  <th>价格</th>
                  <th>数量</th>
                </tr>
              </thead>
              <tbody>
                {% for item in items %}
                  <tr>
                    <td>{{ item.name }}</td>
                    <td>¥{{ item.price }}</td>
                    <td>
                      <input
                        type="number"
                        min="0"
                        max="20"
                        value="0"
                        class="qty-input"
                        data-item-id="{{ item.id }}"
                        data-item-name="{{ item.name }}"
                        data-item-price="{{ item.price }}"
                      />
                    </td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        {% endfor %}
      </section>

      <section class="panel order-panel">
        <h2>提交订单</h2>
        <form id="order-form">
          <label>
            姓名
            <input type="text" name="customer_name" required />
          </label>
          <label>
            手机号
            <input type="text" name="customer_phone" required />
          </label>
          <label>
            取餐时间（可选）
            <input type="text" name="pickup_time" placeholder="例如 12:10" />
          </label>
          <label>
            备注（可选）
            <textarea name="notes" rows="3" placeholder="少辣、不要香菜等"></textarea>
          </label>

          <div class="summary" id="summary">当前未选择菜品</div>
          <button type="submit">确认下单</button>
        </form>
        <div id="result" class="result"></div>
      </section>
    </main>

    <script>
      const qtyInputs = [...document.querySelectorAll('.qty-input')];
      const summaryEl = document.getElementById('summary');
      const resultEl = document.getElementById('result');
      const formEl = document.getElementById('order-form');

      function collectItems() {
        return qtyInputs
          .map((input) => {
            const quantity = Number(input.value || 0);
            return {
              menu_item_id: Number(input.dataset.itemId),
              name: input.dataset.itemName,
              price: Number(input.dataset.itemPrice),
              quantity,
            };
          })
          .filter((item) => item.quantity > 0);
      }

      function refreshSummary() {
        const items = collectItems();
        if (!items.length) {
          summaryEl.textContent = '当前未选择菜品';
          return;
        }
        const total = items.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const lines = items.map((item) => `${item.name} x ${item.quantity}`);
        summaryEl.textContent = `${lines.join('，')} | 合计 ¥${total.toFixed(2)}`;
      }

      qtyInputs.forEach((input) => input.addEventListener('input', refreshSummary));

      formEl.addEventListener('submit', async (event) => {
        event.preventDefault();
        resultEl.textContent = '';

        const items = collectItems();
        const formData = new FormData(formEl);
        const payload = {
          customer_name: String(formData.get('customer_name') || '').trim(),
          customer_phone: String(formData.get('customer_phone') || '').trim(),
          pickup_time: String(formData.get('pickup_time') || '').trim(),
          notes: String(formData.get('notes') || '').trim(),
          items: items.map((item) => ({
            menu_item_id: item.menu_item_id,
            quantity: item.quantity,
          })),
        };

        try {
          const response = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) {
            resultEl.className = 'result error';
            resultEl.textContent = data.error || '下单失败';
            return;
          }

          resultEl.className = 'result success';
          resultEl.textContent = `下单成功，订单号 #${data.order_id}，金额 ¥${Number(data.total_amount).toFixed(2)}`;
          formEl.reset();
          qtyInputs.forEach((input) => (input.value = 0));
          refreshSummary();
        } catch (err) {
          resultEl.className = 'result error';
          resultEl.textContent = '网络错误，请稍后重试';
        }
      });

      refreshSummary();
    </script>
  </body>
</html>
