required_mcps:
  - name: huaweicloud-deploy
    version: "0.1.0"
    path: ../../../shared-mcps/huaweicloud-deploy
    runtime: node
    entry_point: server.mjs
    transport: stdio
    tools:
      - name: GenerateTerraformFromArchitecture
        used: true
        access: write_local
        approval_required: false
        description: "Generate Terraform files from architecture JSON"
      - name: ValidateTerraformConfiguration
        used: true
        access: read_only
        approval_required: false
        description: "Validate generated Terraform configuration"
      - name: RunTerraformPlan
        used: true
        access: read_only
        approval_required: false
        description: "Preview Terraform changes without applying"
      - name: ExplainTerraformPlan
        used: true
        access: read_only
        approval_required: false
        description: "Analyze and explain Terraform plan"
    tools_not_used: []
    write_operations: []
    validation_status: VERIFIED_FROM_CODE

optional_mcps:
  - name: huaweicloud-pricing
    version: "0.1.0"
    path: ../../../shared-mcps/huaweicloud-pricing
    runtime: node
    entry_point: server.mjs
    transport: stdio
    tools_used:
      - EstimateArchitectureOnDemandPrice
      - EstimateArchitecturePeriodPrice
    tools_not_used:
      - QueryCloudServiceTypes
      - QueryResourceTypes
      - QueryServiceResources
      - QueryUsageTypes
      - QueryMeasurementUnits
      - QueryElbFlavors
      - QueryElbAvailabilityZones
      - QueryRdsFlavors
      - QueryRdsStorageTypes
      - QueryEcsFlavors
      - QueryEvsVolumeTypes
      - PricingHealthCheck
      - ListPricingTemplates
      - ExplainRequiredTemplate
      - EstimateArchitectureCostDraft
      - EstimateTemplateOnDemandPrice
      - EstimateTemplatePeriodPrice
      - QueryOnDemandPrice
      - QueryPeriodPrice
      - RenderProductInfosFromTemplate
      - PricingProductInfoGuide
      - EvaluateEcsFlavorAvailability
      - FindEcsFlavorCandidates
    write_operations: []
    validation_status: VERIFIED_FROM_CODE

  - name: huaweicloud-ticket
    version: "0.1.0"
    path: ../../../shared-mcps/huaweicloud-ticket
    runtime: node
    entry_point: server.mjs
    transport: stdio
    tools_used:
      - prepare_ticket
      - create_ticket
    tools_not_used:
      - init_session
      - list_service_categories
      - list_issue_categories
      - get_ticket_form_schema
      - list_regions
      - list_severities
      - check_create_privilege
      - list_tickets
    write_operations:
      - create_ticket
    validation_status: VERIFIED_FROM_CODE

  - name: playwright
    version: latest
    path: ../../../integrations/playwright
    runtime: npx
    entry_point: "@playwright/mcp@latest"
    transport: stdio
    tools_used: []
    tools_not_used: []
    write_operations: []
    validation_status: VERIFIED_FROM_DOCUMENTATION
